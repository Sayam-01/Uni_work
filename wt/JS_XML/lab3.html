<!DOCTYPE html>
<html>
<head>
<title>Lab 3 - 2D Arrays</title>

</head>
<body>

<h2>2D Array in Table</h2>
<table border="1" id="arrTable" cellpadding="5"></table>

<script>
// Creating arrays
var simpleArray = ["HTML", "CSS", "JavaScript"];
var arr2D = [
  [1, "Sayam", 85],
  [2, "Ram", 78],
  [3, "Sita", 92]
];

var table = document.getElementById("arrTable");
for (var i = 0; i < arr2D.length; i++) {
  var row = table.insertRow();
  for (var j = 0; j < arr2D[i].length; j++) {
    var cell = row.insertCell();
    cell.innerText = arr2D[i][j];
  }
}
</script>

</body>
</html>
