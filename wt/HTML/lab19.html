<!DOCTYPE html>
<html>
<head>
<title>Lab 19 - align, vspace, hspace</title>
</head>
<body>

<h2>Image Gallery using align, vspace, hspace</h2>
  <img src="https://picsum.photos/seed/g1/150/150" align="right" vspace="15" hspace="15" alt="Image 1">
  <img src="https://picsum.photos/seed/g2/150/150" align="left" vspace="15" hspace="15" alt="Image 2">
  <img src="https://picsum.photos/seed/g3/150/150" align="right" vspace="15" hspace="15" alt="Image 3">
  <img src="https://picsum.photos/seed/g4/150/150" align="left" vspace="15" hspace="15" alt="Image 4">
  <img src="https://picsum.photos/seed/g5/150/150" align="right" vspace="15" hspace="15" alt="Image 5">
  <img src="https://picsum.photos/seed/g6/150/150" align="left" vspace="15" hspace="15" alt="Image 6">
<p>
This paragraph text wraps around the images above, demonstrating how the align attribute
positions images to the left or right, while vspace and hspace add vertical and horizontal spacing
around each image.
</p>


  <hr>

</body>
</html>
