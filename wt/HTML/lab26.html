<!DOCTYPE html>
<html>
<head>
<title>Lab 26 - Form with 10 Input Types</title>
</head>
<body>

<h2>Registration Form</h2>
<form action="#" method="post">
  <label>Text: <input type="text" name="fullname" placeholder="Full Name" required></label><br><br>
  <label>Password: <input type="password" name="pwd" minlength="6" required></label><br><br>
  <label>Email: <input type="email" name="email" required></label><br><br>
  <label>Number: <input type="number" name="age" min="1" max="100"></label><br><br>
  <label>Date: <input type="date" name="dob"></label><br><br>
  <label>Radio: <input type="radio" name="gender" value="male" checked> Male
                <input type="radio" name="gender" value="female"> Female</label><br><br>
  <label>Checkbox: <input type="checkbox" name="terms" value="accept"> Accept Terms</label><br><br>
  <label>File: <input type="file" name="upload"></label><br><br>
  <label>Range: <input type="range" name="rating" min="1" max="10"></label><br><br>
  <label>Color: <input type="color" name="favcolor"></label><br><br>
  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
</form>


  <hr>
  <footer style="text-align:left; font-weight:bold; margin-top:20px;">
    By Sayam Shrestha
  </footer>

</body>
</html>
