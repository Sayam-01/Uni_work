<!DOCTYPE html>
<html>
<head>
<title>Lab 24 - Complex Table Spanning</title>
</head>
<body>

<h2>Complex Table Layout</h2>
<table border="1" cellpadding="10" cellspacing="0" style="text-align:center;">
  <tr>
    <td>A</td><td>B</td><td>C</td><td>D</td>
  </tr>
  <tr>
    <td colspan="2">E</td>
    <td colspan="2" rowspan="2">F</td>
  </tr>
  <tr>
    <td colspan="2">G</td>
  </tr>
  <tr>
    <td>H</td><td>J</td><td colspan="2">K</td>
  </tr>
  <tr>
    <td colspan="2">L</td><td colspan="2">M</td>
  </tr>
</table>
<p><i>Note: Layout approximates the given grid using rowspan/colspan combinations.</i></p>


  <hr>

    By Sayam Shrestha
  </footer>

</body>
</html>
