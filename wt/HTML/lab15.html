<!DOCTYPE html>
<html>
<head>
<title>Lab 15 - Nested Table</title>
</head>
<body>

<h2>Nested Table with rowspan and colspan</h2>
<table border="1" cellpadding="5" cellspacing="0" width="500">
  <tr>
    <th colspan="2">Outer Header</th>
  </tr>
  <tr>
    <td rowspan="2">Row Span Cell</td>
    <td>
      <table border="1" cellpadding="3" cellspacing="0" width="100%">
        <tr><th>Inner A</th><th>Inner B</th></tr>
        <tr><td>1</td><td>2</td></tr>
      </table>
    </td>
  </tr>
  <tr>
    <td>Second Row, Second Cell</td>
  </tr>
</table>


  <hr>
  <footer style="text-align:left; font-weight:bold; margin-top:20px;">
    By Sayam Shrestha
  </footer>

</body>
</html>
