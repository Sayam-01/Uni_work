<!DOCTYPE html>
<html>
<head>
<title>Lab 25 - Website Layout Table</title>
</head>
<body>

<h2>Website Layout using Nested Tables</h2>
<table border="1" cellpadding="10" cellspacing="0" width="600">
  <tr>
    <td>
      <table border="0" width="100%">
        <tr>
          <td><img src="https://picsum.photos/seed/logo/60/60" alt="Logo"></td>
          <td><h2>ABC Company</h2></td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td>
      <a href="#">Home</a> | <a href="#">About Us</a> | <a href="#">Contact Us</a>
    </td>
  </tr>
  <tr>
    <td>
      <table border="0" width="100%">
        <tr>
          <td width="50%">Content 1</td>
          <td width="50%">News 1</td>
        </tr>
        <tr>
          <td>Content 2</td>
          <td>News 2</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td>
      Copyright &copy; ABC Company | <a href="#">Facebook</a>, <a href="#">Twitter</a> | Powered by Sayam Shrestha
    </td>
  </tr>
</table>


  <hr>
  <footer style="text-align:left; font-weight:bold; margin-top:20px;">
    By Sayam Shrestha
  </footer>

</body>
</html>
