<!DOCTYPE html>
<html>
<head>
<title>Lab 7 - Styled Class Table</title>
<style>

table { border-collapse: collapse; }
td {
  width: 150px;
  height: 60px;
  text-align: center;
  font-weight: bold;
}
.a { border: 3px solid red; background-color: #ffe0e0; color: blue; text-transform: lowercase; }
.b { border: 3px dashed green; background-color: #e0ffe0; color: darkorange; text-transform: lowercase; }
.c { border: 3px dotted blue; background-color: #e0e0ff; color: purple; text-transform: uppercase; }
.d { border: 3px double black; background-color: #fff0e0; color: teal; text-transform: uppercase; }

</style>
</head>
<body>

<h2>Class Table</h2>
<table>
  <tr>
    <td class="a">Class A</td>
    <td class="b">Class B</td>
  </tr>
  <tr>
    <td class="c">Class C</td>
    <td class="d">Class D</td>
  </tr>
</table>


  <hr>
  <footer style="text-align:left; font-weight:bold; margin-top:20px;">
    By Sayam Shrestha
  </footer>

</body>
</html>
