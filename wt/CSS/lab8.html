<!DOCTYPE html>
<html>
<head>
<title>Lab 8 - Horizontal Navigation Menu</title>
<style>

nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
}
nav ul li {
  margin-right: 5px;
}
nav ul li a {
  display: block;
  padding: 10px 15px;
  border: 1px solid #333;
  background-color: #2c3e50;
  color: white;
  text-decoration: none;
}
nav ul li a:hover {
  background-color: #e74c3c;
  color: yellow;
  font-size: 18px;
}

</style>
</head>
<body>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Gallery</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>


  <hr>
  <footer style="text-align:left; font-weight:bold; margin-top:20px;">
    By Sayam Shrestha
  </footer>

</body>
</html>
