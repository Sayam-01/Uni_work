<!DOCTYPE html>
<html>
<head>
<title>Lab 2 - Four Styled Paragraphs</title>
<style>

p.p1 { color: darkred; font-family: Georgia, serif; font-size: 18px; }
p.p2 { color: darkblue; font-family: Arial, sans-serif; font-style: italic; }
p.p3 { color: darkgreen; text-align: center; text-decoration: underline; }
p.p4 { color: purple; letter-spacing: 2px; text-transform: uppercase; }

</style>
</head>
<body>

<p class="p1">Paragraph 1: Styled with a serif font and dark red color.</p>
<p class="p2">Paragraph 2: Styled with italic sans-serif font in dark blue.</p>
<p class="p3">Paragraph 3: Centered and underlined in dark green.</p>
<p class="p4">Paragraph 4: Uppercase with letter spacing in purple.</p>


  <hr>
  <footer style="text-align:center; font-weight:bold; margin-top:20px;">
    By Sayam Shrestha
  </footer>

</body>
</html>
